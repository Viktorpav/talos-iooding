apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # UI Optimization: Reduce the frequency of polling to save browser RAM/CPU
  ui.config: |
    {
      "refreshInterval": 60000,
      "resourceStatus.processors": 5
    }
  # General timeout and performance settings
  timeout.reconciliation: 180s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Reduce the number of parallel status processors (saves server-side RAM)
  controller.status.processors: "5"
  controller.operation.processors: "5"
  # Disable dex if not used (saves ~40Mi RAM)
  server.dex.server.disable: "true"
  # Enable Gzip compression at the server level
  server.enable.gzip: "true"
